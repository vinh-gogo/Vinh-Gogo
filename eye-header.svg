<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">vinh-gogo</title>
  <desc id="d">Con mắt hoạt hình chớp mắt và đảo nhìn quanh, bên cạnh tên và vai trò Kỹ sư AI.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#24243e"/>
      <stop offset="0.5" stop-color="#302b63"/>
      <stop offset="1" stop-color="#0f0c29"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8c0ff"/>
      <stop offset="1" stop-color="#3f2b96"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8c0ff"/>
      <stop offset="1" stop-color="#5ff2ff"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0.62" stop-color="#6f42c1" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6f42c1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sclera" cx="0.5" cy="0.5" r="0.5" fx="0.3" fy="0.3">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.8" stop-color="#f0f0f0"/>
      <stop offset="1" stop-color="#d1c5e6"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5" fx="0.4" fy="0.4">
      <stop offset="0" stop-color="#5ff2ff"/>
      <stop offset="0.4" stop-color="#0e5a8a"/>
      <stop offset="0.8" stop-color="#041836"/>
      <stop offset="1" stop-color="#010614"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1845" stop-opacity="0.45"/>
      <stop offset="0.4" stop-color="#1f1845" stop-opacity="0"/>
      <stop offset="1" stop-color="#1f1845" stop-opacity="0.2"/>
    </linearGradient>
    <clipPath id="eye">
      <ellipse cx="67" cy="67" rx="60" ry="36"/>
    </clipPath>
  </defs>

  <style>
    /* Nhìn quanh: ưu tiên liếc sang phải, về phía tên */
    .gaze { animation: gaze 9s ease-in-out infinite; }
    @keyframes gaze {
      0%, 8%   { transform: translate(0, 0); }
      16%, 34% { transform: translate(13px, -3px); }
      42%, 52% { transform: translate(-11px, 3px); }
      60%, 68% { transform: translate(3px, 7px); }
      76%, 92% { transform: translate(13px, -3px); }
      100%     { transform: translate(0, 0); }
    }

    /* Chớp mắt: đóng nhanh, mở chậm hơn một chút */
    .lid-t { transform: translateY(-46px); animation: lt 5.5s ease-in-out infinite; }
    .lid-b { transform: translateY(34px);  animation: lb 5.5s ease-in-out infinite; }
    .lash  { opacity: 0;                   animation: ls 5.5s ease-in-out infinite; }
    @keyframes lt { 0%, 88%, 100% { transform: translateY(-46px); } 91%, 92% { transform: translateY(0); } 96.5% { transform: translateY(-46px); } }
    @keyframes lb { 0%, 88%, 100% { transform: translateY(34px); }  91%, 92% { transform: translateY(0); } 96.5% { transform: translateY(34px); } }
    @keyframes ls { 0%, 88%, 100% { opacity: 0; } 91%, 92% { opacity: 1; } 96.5% { opacity: 0; } }

    .h { font: 700 56px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: url(#name); }
    .s { font: 500 22px "Segoe UI", Helvetica, Arial, sans-serif; fill: #d1c5e6; }
    .m { font: 400 16px "Segoe UI", Helvetica, Arial, sans-serif; fill: #a39dd1; }

    @media (prefers-reduced-motion: reduce) {
      .gaze, .lid-t, .lid-b, .lash { animation: none; }
    }
  </style>

  <rect width="960" height="320" rx="20" fill="url(#bg)"/>

  <!-- Quầng sáng + đĩa tròn -->
  <circle cx="190" cy="160" r="170" fill="url(#halo)"/>
  <circle cx="190" cy="160" r="125" fill="url(#disc)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

  <!-- Con mắt -->
  <g transform="translate(190 160) scale(1.25) translate(-67 -67)">
    <ellipse cx="67" cy="67" rx="60" ry="36" fill="url(#sclera)"/>
    <g clip-path="url(#eye)">
      <g class="gaze">
        <circle cx="67" cy="67" r="22" fill="url(#iris)"/>
        <circle cx="67" cy="67" r="21.5" fill="none" stroke="#1a0b2e" stroke-width="1.5" opacity="0.8"/>
        <circle cx="67" cy="67" r="9" fill="#000">
          <animate attributeName="r" values="9;10.5;9" dur="4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="60" cy="59" r="3.5" fill="#fff" fill-opacity="0.9"/>
        <circle cx="72" cy="73" r="1.5" fill="#fff" fill-opacity="0.5"/>
      </g>
      <ellipse cx="67" cy="67" rx="60" ry="36" fill="url(#shade)"/>
      <path class="lid-t" d="M-5 -70H139V67Q67 82 -5 67Z" fill="#5b53bb"/>
      <path class="lid-b" d="M-5 67Q67 82 139 67V200H-5Z" fill="#5b53bb"/>
    </g>
    <path class="lash" d="M7 67Q67 80 127 67" fill="none" stroke="#0a0514" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="67" cy="67" rx="60" ry="36" fill="none" stroke="#0a0514" stroke-opacity="0.55" stroke-width="2"/>
  </g>

  <!-- Chữ -->
  <text class="h" x="372" y="140">vinh-gogo</text>
  <text class="s" x="374" y="184">Kỹ sư AI chuyên LLM và hệ thống Multi-Agent</text>
  <text class="m" x="374" y="222">Dự án gần đây: Agentic tư vấn bất động sản với LangGraph</text>
</svg>
