<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" role="img" aria-label="vinh-gogo, AI Engineer building LLM and Multi-Agent systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.55" stop-color="#1e1650"/>
      <stop offset="1" stop-color="#3f2b96"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" rx="16" fill="url(#bg)"/>

  <!-- agent network -->
  <g stroke="#7C3AED" stroke-opacity="0.55" stroke-width="1.5" fill="none">
    <line x1="640" y1="100" x2="560" y2="50"/>
    <line x1="640" y1="100" x2="720" y2="55"/>
    <line x1="640" y1="100" x2="705" y2="155"/>
    <line x1="640" y1="100" x2="590" y2="160"/>
    <line x1="560" y1="50" x2="720" y2="55"/>
    <line x1="590" y1="160" x2="705" y2="155"/>
  </g>
  <g fill="#06B6D4">
    <circle cx="560" cy="50" r="6"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="55" r="6"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="705" cy="155" r="6"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="590" cy="160" r="6"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="2.1s" repeatCount="indefinite"/></circle>
  </g>
  <circle cx="640" cy="100" r="16" fill="#7C3AED">
    <animate attributeName="r" values="14;18;14" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="100" r="28" fill="none" stroke="#7C3AED" stroke-opacity="0.4">
    <animate attributeName="r" values="22;36;22" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.5;0;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- text -->
  <text x="48" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">vinh-gogo</text>
  <rect x="48" y="104" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="0;140;140" keyTimes="0;0.4;1" dur="3s" fill="freeze"/>
  </rect>
  <text x="48" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#06B6D4">AI Engineer</text>
  <text x="48" y="168" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#c9d1d9" fill-opacity="0.85">LLM Applications · Multi-Agent Systems · RAG</text>
</svg>
