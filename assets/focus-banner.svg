<svg xmlns="http://www.w3.org/2000/svg" width="800" height="130" viewBox="0 0 800 130" role="img" aria-label="Focus areas: LLM Applications, Multi-Agent Systems, RAG Pipelines, AI Infrastructure" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="800" height="130" rx="16" fill="#0f0c29"/>
  <text x="400" y="34" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="5" fill="#7C3AED">FOCUS AREAS</text>

  <g font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">
    <rect x="30" y="56" width="170" height="52" rx="12" fill="#1e1650" stroke="#3f2b96" stroke-width="1.5">
      <animate attributeName="stroke" values="#3f2b96;#06B6D4;#3f2b96" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="115" y="87">LLM Applications</text>

    <rect x="220" y="56" width="170" height="52" rx="12" fill="#1e1650" stroke="#3f2b96" stroke-width="1.5">
      <animate attributeName="stroke" values="#3f2b96;#06B6D4;#3f2b96" dur="4s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <text x="305" y="87">Multi-Agent Systems</text>

    <rect x="410" y="56" width="170" height="52" rx="12" fill="#1e1650" stroke="#3f2b96" stroke-width="1.5">
      <animate attributeName="stroke" values="#3f2b96;#06B6D4;#3f2b96" dur="4s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <text x="495" y="87">RAG Pipelines</text>

    <rect x="600" y="56" width="170" height="52" rx="12" fill="#1e1650" stroke="#3f2b96" stroke-width="1.5">
      <animate attributeName="stroke" values="#3f2b96;#06B6D4;#3f2b96" dur="4s" begin="3s" repeatCount="indefinite"/>
    </rect>
    <text x="685" y="87">AI Infrastructure</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
