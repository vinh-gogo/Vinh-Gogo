<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" role="img" aria-label="Claw-CLI — Vietnamese Voice CLI &amp; Safety Sandbox">
  <title>Claw-CLI — Vietnamese Voice CLI &amp; Safety Sandbox</title>
  <defs>
    <clipPath id="clipFrame">
      <rect x="0" y="0" width="780" height="430" rx="24"/>
    </clipPath>
    <linearGradient id="bgRoyal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030714"/>
      <stop offset="42%" stop-color="#081638"/>
      <stop offset="78%" stop-color="#0D2254"/>
      <stop offset="100%" stop-color="#040B1D"/>
    </linearGradient>
    <radialGradient id="orbSapphire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.44"/>
      <stop offset="48%" stop-color="#1D4ED8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#030714" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.32"/>
      <stop offset="48%" stop-color="#B45309" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#030714" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="52%" stop-color="#0284C7" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#030714" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="jewelGoldHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#FBBF24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="jewelBlueHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.95"/>
      <stop offset="38%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldFoil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="28%" stop-color="#FEF08A"/>
      <stop offset="58%" stop-color="#F59E0B"/>
      <stop offset="84%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="goldBezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="25%" stop-color="#FBBF24"/>
      <stop offset="52%" stop-color="#92400E"/>
      <stop offset="78%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <radialGradient id="goldDisc3D" cx="34%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="26%" stop-color="#FEF08A"/>
      <stop offset="58%" stop-color="#F59E0B"/>
      <stop offset="86%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </radialGradient>
    <linearGradient id="liquidGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#132C63" stop-opacity="0.82"/>
      <stop offset="52%" stop-color="#0A193B" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#061029" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="liquidGlassBright" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3F8A" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#091736" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="royalBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.82"/>
      <stop offset="36%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#1D4ED8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="cardBorderGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.72"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="goldBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset="35%" stop-color="#FBBF24" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#FFFBEB" stop-opacity="1"/>
      <stop offset="65%" stop-color="#38BDF8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldRuleFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0"/>
      <stop offset="25%" stop-color="#FBBF24" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#FFFBEB" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardRuleLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0"/>
    </linearGradient>
    <pattern id="royalGrid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 H 0 V 56" fill="none" stroke="#60A5FA" stroke-opacity="0.06" stroke-width="1"/>
      <circle cx="28" cy="28" r="1" fill="#FDE68A" fill-opacity="0.14"/>
    </pattern>
    <filter id="royalGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
    .serif { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .rise-1 { animation: royalRise 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.05s both; }
    .rise-2 { animation: royalRise 0.80s cubic-bezier(0.22, 1, 0.36, 1) 0.16s both; }
    .rise-3 { animation: royalRise 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.28s both; }
    .rise-4 { animation: royalRise 0.90s cubic-bezier(0.22, 1, 0.36, 1) 0.40s both; }
    @keyframes royalRise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
  <g clip-path="url(#clipFrame)">
    <rect x="0" y="0" width="780" height="430" fill="url(#bgRoyal)"/>
    <rect x="0" y="0" width="780" height="430" fill="url(#royalGrid)"/>
    <circle cx="620" cy="150" r="260" fill="url(#orbSapphire)"/>
    <circle cx="140" cy="80" r="220" fill="url(#orbGold)"/>

    <!-- Top Crown Pills -->
    <rect x="36" y="28" width="244" height="34" rx="17" fill="url(#liquidGlassBright)" stroke="url(#goldFoil)" stroke-width="1.3"/>
    <text class="mono" x="158" y="49" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#FEF3C7">03 • EDGE VOICE TERMINAL</text>

    <rect x="536" y="28" width="208" height="34" rx="17" fill="#06122E" stroke="#2563EB" stroke-opacity="0.7" stroke-width="1.3"/>
    <circle cx="558" cy="45" r="4.5" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text class="mono" x="648" y="49" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#E2E8F0">ONNX + SANDBOX</text>

    <!-- Title & Subtitle -->
    <text class="sans" x="36" y="112" font-size="36" font-weight="900" letter-spacing="0.5" fill="url(#goldFoil)">Claw-CLI</text>
    <text class="sans" x="36" y="142" font-size="15.5" font-weight="600" fill="#93C5FD">Vietnamese Voice CLI &amp; Safety Sandbox</text>
    <rect x="36" y="158" width="400" height="2" fill="url(#cardRuleLeft)"/>

    <!-- 3 Key Engineering Specs -->
    <polygon points="42,184 47,189 42,194 37,189" fill="#FEF08A"/>
    <text class="sans" x="58" y="194" font-size="14.5" fill="#E2E8F0">Sub-30ms on-device VAD via Silero v5 ONNX</text>
    <polygon points="42,218 47,223 42,228 37,223" fill="#38BDF8"/>
    <text class="sans" x="58" y="228" font-size="14.5" fill="#E2E8F0">Vietnamese voice-to-shell command grounding</text>
    <polygon points="42,252 47,257 42,262 37,257" fill="#FEF08A"/>
    <text class="sans" x="58" y="262" font-size="14.5" fill="#E2E8F0">4-Tier privilege &amp; blast-radius safety guard</text>

    <!-- Right Illustrated Live Preview Viewport -->
    <rect x="464" y="82" width="280" height="192" rx="18" fill="#030919" opacity="0.88" stroke="url(#cardBorderGold)" stroke-width="1.5"/>
      <g>
        <text class="mono" x="482" y="110" font-size="11" font-weight="700" letter-spacing="1.5" fill="#38BDF8">SILERO VAD v5 LIVE</text>
        <!-- 9-Bar Live Acoustic Waveform -->
        <rect x="492" y="166" width="10" height="32" rx="5" fill="#38BDF8"><animate attributeName="y" values="166;142;166" dur="1.2s" repeatCount="indefinite"/><animate attributeName="height" values="32;56;32" dur="1.2s" repeatCount="indefinite"/></rect>
        <rect x="514" y="150" width="10" height="48" rx="5" fill="url(#goldFoil)"><animate attributeName="y" values="150;172;150" dur="1.0s" repeatCount="indefinite"/><animate attributeName="height" values="48;26;48" dur="1.0s" repeatCount="indefinite"/></rect>
        <rect x="536" y="136" width="10" height="62" rx="5" fill="#FEF08A"><animate attributeName="y" values="136;164;136" dur="0.9s" repeatCount="indefinite"/><animate attributeName="height" values="62;34;62" dur="0.9s" repeatCount="indefinite"/></rect>
        <rect x="558" y="156" width="10" height="42" rx="5" fill="url(#goldFoil)"><animate attributeName="y" values="156;134;156" dur="1.15s" repeatCount="indefinite"/><animate attributeName="height" values="42;64;42" dur="1.15s" repeatCount="indefinite"/></rect>
        <rect x="580" y="144" width="10" height="54" rx="5" fill="#38BDF8"><animate attributeName="y" values="144;168;144" dur="1.05s" repeatCount="indefinite"/><animate attributeName="height" values="54;30;54" dur="1.05s" repeatCount="indefinite"/></rect>
        <rect x="602" y="160" width="10" height="38" rx="5" fill="url(#goldFoil)"><animate attributeName="y" values="160;140;160" dur="1.3s" repeatCount="indefinite"/><animate attributeName="height" values="38;58;38" dur="1.3s" repeatCount="indefinite"/></rect>
        <!-- Safety Shield -->
        <path d="M 678 132 L 712 144 V 172 C 712 194 696 210 678 218 C 660 210 644 194 644 172 V 144 Z" fill="#0B1F4D" stroke="url(#goldFoil)" stroke-width="2"/>
        <path d="M 667 174 L 675 182 L 691 166" fill="none" stroke="#34D399" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="mono" x="604" y="254" text-anchor="middle" font-size="10.5" fill="#FEF08A">SANDBOX TIER 1–4 VERIFIED</text>
      </g>

    <!-- Tech Stack Chips -->
      <rect x="36" y="298" width="145" height="34" rx="17" fill="#081738" stroke="#2563EB" stroke-opacity="0.65" stroke-width="1.2"/>
      <text class="mono" x="108.5" y="319" text-anchor="middle" font-size="12" font-weight="600" fill="#E2E8F0">Silero VAD v5</text>
      <rect x="191" y="298" width="137" height="34" rx="17" fill="#081738" stroke="#2563EB" stroke-opacity="0.65" stroke-width="1.2"/>
      <text class="mono" x="259.5" y="319" text-anchor="middle" font-size="12" font-weight="600" fill="#E2E8F0">ONNX Runtime</text>
      <rect x="338" y="298" width="154" height="34" rx="17" fill="#081738" stroke="#2563EB" stroke-opacity="0.65" stroke-width="1.2"/>
      <text class="mono" x="415.0" y="319" text-anchor="middle" font-size="12" font-weight="600" fill="#E2E8F0">Vietnamese ASR</text>
      <rect x="502" y="298" width="154" height="34" rx="17" fill="#081738" stroke="#2563EB" stroke-opacity="0.65" stroke-width="1.2"/>
      <text class="mono" x="579.0" y="319" text-anchor="middle" font-size="12" font-weight="600" fill="#E2E8F0">4-Tier Sandbox</text>

    <!-- Bottom Divider, Telemetry & 24K Gold CTA Button -->
    <rect x="36" y="348" width="708" height="1.5" fill="url(#cardRuleLeft)"/>
    <text class="mono" x="36" y="388" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#94A3B8">LATENCY // &lt;30ms ON-DEVICE VAD • 4-TIER GUARD</text>

    <rect x="530" y="362" width="214" height="42" rx="21" fill="url(#goldFoil)"/>
    <text class="sans" x="637" y="388" text-anchor="middle" font-size="13" font-weight="900" letter-spacing="1.2" fill="#040A1C">READ MONOGRAPH ↗</text>
    <!-- Sweeping liquid-gold & sapphire edge light beams -->
    <rect x="-420" y="0" width="420" height="3" fill="url(#goldBeam)">
      <animate attributeName="x" values="-420;780" dur="7.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="780" y="427" width="420" height="3" fill="url(#goldBeam)">
      <animate attributeName="x" values="780;-420" dur="7.5s" repeatCount="indefinite"/>
    </rect>
    <!-- Double-bevelled royal luxury frame & machined 24K gold corner lugs -->
    <rect x="7" y="7" width="766" height="416" rx="19" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>
    <rect x="1" y="1" width="778" height="428" rx="23" fill="none" stroke="url(#royalBorder)" stroke-width="2"/>
    <g stroke="url(#goldFoil)" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.92">
      <path d="M 10 38 V 26 A 16 16 0 0 1 26 10 H 38"/>
      <path d="M 742 10 H 754 A 16 16 0 0 1 770 26 V 38"/>
      <path d="M 10 392 V 404 A 16 16 0 0 0 26 420 H 38"/>
      <path d="M 742 420 H 754 A 16 16 0 0 0 770 404 V 392"/>
    </g>
  </g>
</svg>
