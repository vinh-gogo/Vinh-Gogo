        <text x="94" y="193" class="sans" font-size="14.5" font-weight="700" fill="#F8FAFC">Content-Addressed Caching</text>
        <text x="94" y="212" class="sans" font-size="12.5" fill="#94A3B8">Hash-verified stores eliminating redundant compute.</text>
      </g>
      <line x1="56" y1="232" x2="496" y2="232" stroke="#1E3A8A" stroke-opacity="0.45" stroke-width="1"/>
