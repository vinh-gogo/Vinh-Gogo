        <text x="94" y="272" class="sans" font-size="12.5" fill="#94A3B8">Auditable 4-tier isolation around agent execution.</text>
      </g>
      <line x1="56" y1="292" x2="496" y2="292" stroke="#1E3A8A" stroke-opacity="0.45" stroke-width="1"/>
      <g>
