<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="412" viewBox="0 0 1200 412" fill="none" role="img" aria-labelledby="tMat dMat">
  <title id="tMat">Engineering Doctrine &amp; Production Runtime Matrix — Lê Quang Vinh</title>
  <desc id="dMat">Architectural principles and four-layer technology runtime matrix across AI inference, Go/Python systems, and Cloudflare Edge.</desc>
