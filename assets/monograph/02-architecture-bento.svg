      <polygon points="928,223 936,227 928,231" fill="#FBBF24"/>

      <!-- Ranked Grounded Context Core -->
      <rect x="942" y="196" width="202" height="62" rx="8" fill="#0E234E" stroke="url(#goldFoil)" stroke-width="1.2"/>
      <text x="1043" y="222" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#FEF3C7">HYBRID FUSION RANKER</text>
      <text x="1043" y="242" text-anchor="middle" class="mono" font-size="10" fill="#93C5FD">Graph Hops + Cosine Top-K</text>
    </g>

    <!-- TILE 03: Deterministic Saga Agents -->
    <g>
      <rect x="32" y="306" width="434" height="214" rx="14" fill="url(#cardSurface)" stroke="#1E3A8A" stroke-width="1.2"/>
      <rect x="48" y="306.5" width="402" height="1.2" fill="url(#goldFade)"/>
      <text x="444" y="364" text-anchor="end" class="serif" font-size="48" font-weight="700" fill="#D4AF37" opacity="0.13">03</text>
      <text x="56" y="336" class="mono" font-size="10.5" font-weight="700" letter-spacing="1.8" fill="#FBBF24">03 // AUTONOMOUS RELIABILITY</text>
      <text x="56" y="364" class="sans" font-size="20.5" font-weight="700" fill="#F8FAFC">Deterministic Saga Agents</text>
      <text x="56" y="388" class="sans" font-size="13" fill="#CBD5E1">Go state machines, Saga rollbacks &amp; safe sandboxes.</text>
      <line x1="56" y1="404" x2="442" y2="404" stroke="#1E3A8A" stroke-opacity="0.55" stroke-width="1"/>
    </g>
    <g>
      <rect x="56" y="424" width="82" height="36" rx="6" fill="#07142E" stroke="#3B82F6" stroke-width="1.2"/>
      <text x="97" y="446" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#E2E8F0">PLAN</text>
      <line x1="138" y1="442" x2="156" y2="442" stroke="#60A5FA" stroke-width="1.4"/>

