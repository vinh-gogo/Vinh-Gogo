<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="556" viewBox="0 0 1200 556" fill="none" role="img" aria-labelledby="tBento dBento">
  <title id="tBento">Core AI R&amp;D Architecture Bento — Lê Quang Vinh</title>
  <desc id="dBento">Four-pillar architectural Bento grid covering Generative AI &amp; Video Diffusion, Hybrid GraphRAG, Deterministic Saga Agents, and On-Device Offline-First Edge Systems.</desc>
  <defs>
    <linearGradient id="bgAbyss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030816"/>
      <stop offset="48%" stop-color="#07142E"/>
      <stop offset="100%" stop-color="#040B1A"/>
    </linearGradient>
    <radialGradient id="glowSapphire" cx="78%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#0B1D42" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#030816" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGoldAmbient" cx="18%" cy="16%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.11"/>
      <stop offset="55%" stop-color="#B4861E" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#030816" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1D40"/>
      <stop offset="100%" stop-color="#061024"/>
    </linearGradient>
    <linearGradient id="cardSurfaceSubtle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091836"/>
      <stop offset="100%" stop-color="#050D1F"/>
    </linearGradient>
    <linearGradient id="goldFoil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="32%" stop-color="#FDE68A"/>
      <stop offset="68%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A6F18"/>
    </linearGradient>
    <linearGradient id="goldHoriz" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9A6F18"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#9A6F18"/>
    </linearGradient>
    <linearGradient id="goldFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FBBF24" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="borderFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.65"/>
      <stop offset="45%" stop-color="#1E3A8A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="bpGrid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 16 0 V 64 M 32 0 V 64 M 48 0 V 64 M 0 16 H 64 M 0 32 H 64 M 0 48 H 64" fill="none" stroke="#3B82F6" stroke-opacity="0.028" stroke-width="1"/>
      <path d="M 64 0 H 0 V 64" fill="none" stroke="#3B82F6" stroke-opacity="0.065" stroke-width="1"/>
      <path d="M -2 0 H 2 M 0 -2 V 2" fill="none" stroke="#FBBF24" stroke-opacity="0.22" stroke-width="1"/>
    </pattern>
    <clipPath id="bentoClip">
      <rect x="0" y="0" width="1200" height="556" rx="20"/>
    </clipPath>
  </defs>
  <style>
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .serif { font-family: 'Playfair Display', Georgia, 'Times New Roman', Times, serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }
    .pulse-calm { animation: pulseCalm 3.4s ease-in-out infinite; }
    .spin-cw { transform-box: fill-box; transform-origin: center; animation: spinCW 56s linear infinite; }
    .spin-ccw { transform-box: fill-box; transform-origin: center; animation: spinCCW 42s linear infinite; }
    @keyframes pulseCalm { 0%, 100% { opacity: 0.42; } 50% { opacity: 1; } }
    @keyframes spinCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    
    .vad-1 { animation: vadPulse 1.8s ease-in-out infinite; }
    .vad-2 { animation: vadPulse 1.8s ease-in-out 0.35s infinite; }
    .vad-3 { animation: vadPulse 1.8s ease-in-out 0.7s infinite; }
    @keyframes vadPulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
  <g clip-path="url(#bentoClip)">
    <rect x="0" y="0" width="1200" height="556" rx="20" fill="url(#bgAbyss)"/>
    <rect x="0" y="0" width="1200" height="556" fill="url(#glowSapphire)"/>
    <rect x="0" y="0" width="1200" height="556" fill="url(#glowGoldAmbient)"/>
    <rect x="0" y="0" width="1200" height="556" fill="url(#bpGrid)"/>
    <!-- Section Header -->
    <g>
      <text x="36" y="44" class="mono" font-size="12.5" font-weight="700" letter-spacing="2.4" fill="#FBBF24">02 // CORE RESEARCH &amp; SYSTEM ARCHITECTURE</text>
      <line x1="430" y1="39" x2="918" y2="39" stroke="#1E3A8A" stroke-opacity="0.65" stroke-width="1"/>
      <text x="1164" y="44" text-anchor="end" class="mono" font-size="11" letter-spacing="1.4" fill="#94A3B8">SPECIFICATION // 4 DETERMINISTIC PILLARS</text>
    </g>

    <!-- TILE 01: Generative AI & Video Diffusion -->
    <g>
      <rect x="32" y="74" width="684" height="214" rx="14" fill="url(#cardSurface)" stroke="#1E3A8A" stroke-width="1.2"/>
      <rect x="48" y="74.5" width="652" height="1.2" fill="url(#goldFade)"/>
      <text x="694" y="132" text-anchor="end" class="serif" font-size="48" font-weight="700" fill="#D4AF37" opacity="0.13">01</text>
      <text x="56" y="104" class="mono" font-size="10.5" font-weight="700" letter-spacing="1.8" fill="#FBBF24">01 // MULTIMODAL SYNTHESIS</text>
      <text x="56" y="132" class="sans" font-size="20.5" font-weight="700" fill="#F8FAFC">Generative AI &amp; Video Diffusion</text>
      <text x="56" y="156" class="sans" font-size="13" fill="#CBD5E1">Reproducible 6-stage synthesis backed by cryptographic content-addressed caching.</text>
      <line x1="56" y1="172" x2="692" y2="172" stroke="#1E3A8A" stroke-opacity="0.55" stroke-width="1"/>
    </g>
    <g>
      <line x1="144" y1="224" x2="162" y2="224" stroke="#3B82F6" stroke-opacity="0.7" stroke-width="1.5"/>
      <rect x="56" y="204" width="88" height="40" rx="7" fill="#07142E" stroke="#3B82F6" stroke-width="1.2"/>
      <text x="100" y="228" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#E2E8F0">01 SCRIPT</text>
      <line x1="250" y1="224" x2="268" y2="224" stroke="#3B82F6" stroke-opacity="0.7" stroke-width="1.5"/>
      <rect x="162" y="204" width="88" height="40" rx="7" fill="#07142E" stroke="#3B82F6" stroke-width="1.2"/>
      <text x="206" y="228" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#E2E8F0">02 SCENE</text>
      <line x1="356" y1="224" x2="374" y2="224" stroke="#3B82F6" stroke-opacity="0.7" stroke-width="1.5"/>
      <rect x="268" y="204" width="88" height="40" rx="7" fill="#102654" stroke="#FBBF24" stroke-width="1.2"/>
      <text x="312" y="228" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#FEF3C7">03 DIFFUSE</text>
      <line x1="462" y1="224" x2="480" y2="224" stroke="#3B82F6" stroke-opacity="0.7" stroke-width="1.5"/>
      <rect x="374" y="204" width="88" height="40" rx="7" fill="#07142E" stroke="#3B82F6" stroke-width="1.2"/>
      <text x="418" y="228" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#E2E8F0">04 MOTION</text>
      <line x1="568" y1="224" x2="586" y2="224" stroke="#3B82F6" stroke-opacity="0.7" stroke-width="1.5"/>
      <rect x="480" y="204" width="88" height="40" rx="7" fill="#07142E" stroke="#3B82F6" stroke-width="1.2"/>
      <text x="524" y="228" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#E2E8F0">05 AUDIO</text>
      <rect x="586" y="204" width="88" height="40" rx="7" fill="#102654" stroke="#FBBF24" stroke-width="1.2"/>
      <text x="630" y="228" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#FEF3C7">06 MUX</text>
      <circle cx="100" cy="224" r="8" fill="#FBBF24" fill-opacity="0.26">
        <animate attributeName="cx" values="100;630;100" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="100" cy="224" r="4" fill="#FEF3C7">
        <animate attributeName="cx" values="100;630;100" dur="8s" repeatCount="indefinite"/>
      </circle>
      <text x="56" y="268" class="mono" font-size="10.5" fill="#94A3B8">MERKLE ARTIFACT CACHE: SHA-256 VERIFIED  •  ZERO REDUNDANT INFERENCE</text>
    </g>

    <!-- TILE 02: Hybrid GraphRAG -->
    <g>
      <rect x="734" y="74" width="434" height="214" rx="14" fill="url(#cardSurface)" stroke="#1E3A8A" stroke-width="1.2"/>
      <rect x="750" y="74.5" width="402" height="1.2" fill="url(#goldFade)"/>
      <text x="1146" y="132" text-anchor="end" class="serif" font-size="48" font-weight="700" fill="#D4AF37" opacity="0.13">02</text>
      <text x="758" y="104" class="mono" font-size="10.5" font-weight="700" letter-spacing="1.8" fill="#FBBF24">02 // GROUNDED RETRIEVAL</text>
      <text x="758" y="132" class="sans" font-size="20.5" font-weight="700" fill="#F8FAFC">Hybrid GraphRAG</text>
      <text x="758" y="156" class="sans" font-size="13" fill="#CBD5E1">Knowledge graphs fused with dense vector retrieval.</text>
      <line x1="758" y1="172" x2="1144" y2="172" stroke="#1E3A8A" stroke-opacity="0.55" stroke-width="1"/>
    </g>
    <g>
