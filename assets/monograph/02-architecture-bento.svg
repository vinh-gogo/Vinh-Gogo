      <rect x="758" y="190" width="132" height="74" rx="8" fill="#061229" stroke="#1E3A8A" stroke-width="1"/>
      <line x1="790" y1="214" x2="856" y2="210" stroke="#FBBF24" stroke-width="1.2"/>
      <line x1="790" y1="214" x2="824" y2="244" stroke="#60A5FA" stroke-width="1.2"/>
      <line x1="856" y1="210" x2="824" y2="244" stroke="#FBBF24" stroke-width="1.2"/>
      <circle cx="790" cy="214" r="5" fill="#FBBF24"/>
