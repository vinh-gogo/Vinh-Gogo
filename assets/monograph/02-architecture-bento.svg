      <rect x="524" y="439" width="6" height="14" rx="3" fill="#60A5FA" class="vad-1"/>
      <rect x="536" y="434" width="6" height="24" rx="3" fill="#60A5FA" class="vad-2"/>
      <rect x="548" y="429" width="6" height="34" rx="3" fill="#FBBF24" class="vad-3"/>
      <rect x="560" y="436" width="6" height="20" rx="3" fill="#60A5FA" class="vad-1"/>
      <rect x="572" y="426" width="6" height="40" rx="3" fill="#FBBF24" class="vad-2"/>
      <rect x="584" y="431" width="6" height="30" rx="3" fill="#FBBF24" class="vad-3"/>
      <rect x="596" y="437" width="6" height="18" rx="3" fill="#60A5FA" class="vad-1"/>
      <rect x="608" y="429" width="6" height="34" rx="3" fill="#FBBF24" class="vad-2"/>
      <rect x="620" y="435" width="6" height="22" rx="3" fill="#60A5FA" class="vad-3"/>
      <rect x="632" y="439" width="6" height="14" rx="3" fill="#60A5FA" class="vad-1"/>
      <text x="584" y="484" text-anchor="middle" class="mono" font-size="9.5" fill="#93C5FD">SILERO VAD v5 ONNX</text>

      <!-- Right: Hugo -> FSRS v5 -> Cloudflare D1 Sync -->
      <rect x="680" y="426" width="136" height="58" rx="8" fill="#07142E" stroke="#3B82F6" stroke-width="1.2"/>
      <text x="748" y="451" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#F8FAFC">HUGO STATIC</text>
      <text x="748" y="469" text-anchor="middle" class="mono" font-size="9.5" fill="#94A3B8">8,400 Pages</text>

      <line x1="816" y1="455" x2="840" y2="455" stroke="#FBBF24" stroke-width="1.5"/>

      <rect x="840" y="426" width="136" height="58" rx="8" fill="#102654" stroke="#FBBF24" stroke-width="1.2"/>
      <text x="908" y="451" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#FEF3C7">FSRS v5</text>
      <text x="908" y="469" text-anchor="middle" class="mono" font-size="9.5" fill="#FDE68A">Offline Scheduler</text>

      <line x1="976" y1="455" x2="1000" y2="455" stroke="#FBBF24" stroke-width="1.5"/>

      <rect x="1000" y="426" width="144" height="58" rx="8" fill="#0D224B" stroke="url(#goldFoil)" stroke-width="1.2"/>
      <text x="1072" y="451" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#FEF3C7">CLOUDFLARE D1</text>
      <text x="1072" y="469" text-anchor="middle" class="mono" font-size="9.5" fill="#93C5FD">Edge SQLite Sync</text>
    </g>
    <rect x="8" y="8" width="1184" height="540" rx="15" fill="none" stroke="#1E3A8A" stroke-opacity="0.45" stroke-width="1"/>
    <g stroke="url(#goldFoil)" stroke-width="1.6" fill="none" opacity="0.88">
      <path d="M 14 36 V 14 H 36"/>
      <path d="M 1164 14 H 1186 V 36"/>
      <path d="M 14 520 V 542 H 36"/>
      <path d="M 1164 542 H 1186 V 520"/>
