      <rect x="484" y="306" width="684" height="214" rx="14" fill="url(#cardSurface)" stroke="#1E3A8A" stroke-width="1.2"/>
      <rect x="500" y="306.5" width="652" height="1.2" fill="url(#goldFade)"/>
      <text x="1146" y="364" text-anchor="end" class="serif" font-size="48" font-weight="700" fill="#D4AF37" opacity="0.13">04</text>
      <text x="508" y="336" class="mono" font-size="10.5" font-weight="700" letter-spacing="1.8" fill="#FBBF24">04 // EDGE &amp; LOCAL INFERENCE</text>
