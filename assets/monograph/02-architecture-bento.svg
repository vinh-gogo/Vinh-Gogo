      <text x="200" y="500" text-anchor="middle" class="mono" font-size="9.5" fill="#FDE68A">SAGA COMPENSATING ROLLBACK  •  4-TIER SANDBOX</text>
    </g>

    <!-- TILE 04: On-Device AI & Offline-First Edge -->
