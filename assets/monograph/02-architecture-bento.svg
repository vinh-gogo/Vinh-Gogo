      <text x="199" y="446" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#E2E8F0">EXECUTE</text>
      <line x1="242" y1="442" x2="260" y2="442" stroke="#60A5FA" stroke-width="1.4"/>

      <rect x="260" y="424" width="84" height="36" rx="6" fill="#102654" stroke="#FBBF24" stroke-width="1.2"/>
      <text x="302" y="446" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#FEF3C7">VERIFY</text>
      <line x1="344" y1="442" x2="360" y2="442" stroke="#FBBF24" stroke-width="1.4"/>

      <rect x="360" y="424" width="82" height="36" rx="6" fill="#0D224B" stroke="url(#goldFoil)" stroke-width="1.2"/>
      <text x="401" y="446" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#FEF3C7">COMMIT</text>

