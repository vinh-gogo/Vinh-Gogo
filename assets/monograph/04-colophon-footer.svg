<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="450" viewBox="0 0 1600 450" role="img" aria-label="Glory Hinody Colophon — Lê Quang Vinh (@vinh-gogo)">
  <title>Glory Hinody Colophon — Lê Quang Vinh (@vinh-gogo)</title>
  <defs>
    <clipPath id="clipFrame">
