      <stop offset="35%" stop-color="#FBBF24" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#FFFBEB" stop-opacity="1"/>
      <stop offset="65%" stop-color="#38BDF8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldRuleFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0"/>
      <stop offset="25%" stop-color="#FBBF24" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#FFFBEB" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardRuleLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0"/>
    </linearGradient>
    <pattern id="royalGrid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 H 0 V 56" fill="none" stroke="#60A5FA" stroke-opacity="0.06" stroke-width="1"/>
      <circle cx="28" cy="28" r="1" fill="#FDE68A" fill-opacity="0.14"/>
    </pattern>
    <filter id="royalGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="footerGoldShine" gradientUnits="userSpaceOnUse" x1="360" y1="0" x2="1240" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="32%" stop-color="#FEF08A"/>
      <stop offset="65%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1760 0" dur="8.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="waveRoyal1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.58"/>
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="waveRoyal2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.44"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.44"/>
    </linearGradient>
    <linearGradient id="waveGold3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D2254" stop-opacity="0.92"/>
      <stop offset="35%" stop-color="#D97706" stop-opacity="0.72"/>
      <stop offset="65%" stop-color="#FBBF24" stop-opacity="0.76"/>
      <stop offset="100%" stop-color="#0D2254" stop-opacity="0.92"/>
    </linearGradient>
    <g id="isoPrism">
      <polygon points="0,-20 20,-10 0,0 -20,-10" fill="url(#cubeTop)"/>
      <polygon points="-20,-10 0,0 0,24 -20,14" fill="url(#cubeLeft)"/>
      <polygon points="20,-10 0,0 0,24 20,14" fill="url(#cubeRight)"/>
    </g>
    <path id="silkWave" d="M 0 38 q 100 -28 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 V 140 H 0 Z"/>
