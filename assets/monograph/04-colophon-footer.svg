  <style>
    .sans { font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
    .serif { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .rise-1 { animation: royalRise 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.05s both; }
    .rise-2 { animation: royalRise 0.80s cubic-bezier(0.22, 1, 0.36, 1) 0.16s both; }
    .rise-3 { animation: royalRise 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.28s both; }
    .rise-4 { animation: royalRise 0.90s cubic-bezier(0.22, 1, 0.36, 1) 0.40s both; }
    @keyframes royalRise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
  <g clip-path="url(#clipFrame)">
    <rect x="0" y="0" width="1600" height="450" fill="url(#bgRoyal)"/>
    <rect x="0" y="0" width="1600" height="450" fill="url(#royalGrid)"/>
    <!-- Volumetric Glows -->
    <circle cx="800" cy="180" r="440" fill="url(#orbSapphire)"/>
    <circle cx="800" cy="340" r="380" fill="url(#orbGold)"/>

    <!-- Levitating 3D Isometric 24K Gold & Sapphire Prisms -->
    <g transform="translate(64 96)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="5.8s" repeatCount="indefinite"/><use href="#isoPrism" transform="scale(1.35)"/></g></g>
    <g transform="translate(1536 92)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 14;0 0" dur="6.4s" repeatCount="indefinite"/><use href="#isoPrism" transform="scale(1.3)"/></g></g>
    <g transform="translate(54 276)" opacity="0.82"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 0" dur="7.2s" repeatCount="indefinite"/><use href="#isoPrism" transform="scale(1.05)"/></g></g>
    <g transform="translate(1544 268)" opacity="0.85"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="5.4s" repeatCount="indefinite"/><use href="#isoPrism" transform="scale(1.15)"/></g></g>

    <!-- Twinkling Stardust -->
    <g fill="#FEF08A">
      <circle cx="290" cy="34" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="1310" cy="38" r="2.2"><animate attributeName="opacity" values="1;0.2;1" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="180" cy="215" r="1.8"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="1420" cy="220" r="1.8"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- 3 Luxury Domain Summary Capsules -->
    <g>
      <rect x="132" y="46" width="424" height="50" rx="25" fill="url(#liquidGlass)" stroke="url(#cardBorderGold)" stroke-width="1.4"/>
      <circle cx="164" cy="71" r="5.5" fill="#FEF08A"/>
      <text class="sans" x="356" y="77" text-anchor="middle" font-size="15.5" font-weight="700" fill="#F8FAFC">Generative AI &amp; Video Diffusion</text>

      <rect x="588" y="46" width="424" height="50" rx="25" fill="url(#liquidGlass)" stroke="url(#cardBorderGold)" stroke-width="1.4"/>
      <circle cx="620" cy="71" r="5.5" fill="#38BDF8"/>
      <text class="sans" x="812" y="77" text-anchor="middle" font-size="15.5" font-weight="700" fill="#F8FAFC">Hybrid GraphRAG &amp; Go Saga Agents</text>

      <rect x="1044" y="46" width="424" height="50" rx="25" fill="url(#liquidGlass)" stroke="url(#cardBorderGold)" stroke-width="1.4"/>
      <circle cx="1076" cy="71" r="5.5" fill="#FEF08A"/>
      <text class="sans" x="1268" y="77" text-anchor="middle" font-size="15.5" font-weight="700" fill="#F8FAFC">Edge Voice ONNX &amp; Offline-First AI</text>
    </g>

    <!-- Grand Collaboration Beacon Capsule -->
    <g>
      <rect x="210" y="124" width="1180" height="60" rx="30" fill="url(#liquidGlassBright)" stroke="url(#goldFoil)" stroke-width="1.7"/>
      <circle cx="254" cy="154" r="6" fill="#34D399"/>
      <circle cx="254" cy="154" r="6" fill="none" stroke="#34D399" stroke-width="2">
        <animate attributeName="r" values="6;16" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text class="sans" x="816" y="160" text-anchor="middle" font-size="17.5" font-weight="700" fill="#FFFFFF">Open to AI R&amp;D Engineering, Research Collaborations &amp; High-Impact Systems Architecture</text>
    </g>

    <!-- Animated Gold Flow Rule -->
    <path d="M 280 212 H 1320" fill="none" stroke="#FBBF24" stroke-opacity="0.48" stroke-width="1.6" stroke-dasharray="8 10">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="2.2s" repeatCount="indefinite"/>
    </path>

    <!-- Executive Sign-Off & Sculpted Gold Star -->
    <text class="sans" x="800" y="264" text-anchor="middle" font-size="30" font-weight="900" letter-spacing="1" fill="url(#footerGoldShine)">Thank You for Exploring Glory Hinody — Lê Quang Vinh</text>
    <text class="mono" x="800" y="302" text-anchor="middle" font-size="14" font-weight="600" letter-spacing="2" fill="#CBD5E1">GLORY-HINODY.PAGES.DEV   •   GLORYVOCAB.COM   •   LEA26462@GMAIL.COM</text>

    <g transform="translate(362 254)">
      <animateTransform attributeName="transform" type="rotate" values="-14;14;-14" dur="3.4s" repeatCount="indefinite" additive="sum"/>
      <polygon points="0,-11 3,-3.5 11,-3.2 4.8,1.8 7,9.5 0,5 -7,9.5 -4.8,1.8 -11,-3.2 -3,-3.5" fill="url(#goldFoil)"/>
    </g>
    <g transform="translate(1238 254)">
      <animateTransform attributeName="transform" type="rotate" values="14;-14;14" dur="3.4s" repeatCount="indefinite" additive="sum"/>
      <polygon points="0,-11 3,-3.5 11,-3.2 4.8,1.8 7,9.5 0,5 -7,9.5 -4.8,1.8 -11,-3.2 -3,-3.5" fill="url(#goldFoil)"/>
    </g>

    <!-- 3-Layer Flowing Royal Sapphire & 24K Liquid Gold Silk Waves -->
    <g transform="translate(0 336)">
      <g>
        <use href="#silkWave" fill="url(#waveRoyal1)"/>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1600 0" dur="20s" repeatCount="indefinite"/>
      </g>
      <g>
        <use href="#silkWave" fill="url(#waveRoyal2)"/>
        <animateTransform attributeName="transform" type="translate" from="-1600 14" to="0 14" dur="15s" repeatCount="indefinite"/>
      </g>
      <g>
        <use href="#silkWave" fill="url(#waveGold3)"/>
        <animateTransform attributeName="transform" type="translate" from="0 28" to="-1600 28" dur="11s" repeatCount="indefinite"/>
      </g>
    </g>
    <!-- Sweeping liquid-gold & sapphire edge light beams -->
    <rect x="-420" y="0" width="420" height="3" fill="url(#goldBeam)">
      <animate attributeName="x" values="-420;1600" dur="8.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="1600" y="447" width="420" height="3" fill="url(#goldBeam)">
      <animate attributeName="x" values="1600;-420" dur="8.5s" repeatCount="indefinite"/>
    </rect>
    <!-- Double-bevelled royal luxury frame & machined 24K gold corner lugs -->
    <rect x="7" y="7" width="1586" height="436" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>
    <rect x="1" y="1" width="1598" height="448" rx="27" fill="none" stroke="url(#royalBorder)" stroke-width="2"/>
    <g stroke="url(#goldFoil)" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.92">
      <path d="M 10 38 V 30 A 20 20 0 0 1 30 10 H 38"/>
      <path d="M 1562 10 H 1570 A 20 20 0 0 1 1590 30 V 38"/>
      <path d="M 10 412 V 420 A 20 20 0 0 0 30 440 H 38"/>
      <path d="M 1562 440 H 1570 A 20 20 0 0 0 1590 420 V 412"/>
    </g>
  </g>
</svg>
