      <stop offset="28%" stop-color="#FEF08A"/>
      <stop offset="58%" stop-color="#F59E0B"/>
      <stop offset="84%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="goldBezel" x1="0" y1="0" x2="1" y2="1">
