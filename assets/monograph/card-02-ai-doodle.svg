      <text x="449" y="123" text-anchor="middle" class="mono" font-size="9.5" fill="#E2E8F0">DRAFT</text>
      <line x1="474" y1="119" x2="492" y2="119" stroke="#FBBF24" stroke-width="1.3"/>
