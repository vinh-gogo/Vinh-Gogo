    <g>
      <text x="28" y="92" class="sans" font-size="25" font-weight="800" letter-spacing="-0.4" fill="#F8FAFC">AI-Doodle CLI</text>
      <text x="28" y="117" class="serif" font-size="14.5" font-style="italic" fill="#FDE68A">Multi-Mode Go Creative Engine &amp; EPUB 3.3</text>
      <text x="28" y="146" class="sans" font-size="13.2" fill="#CBD5E1">Deterministic publishing engine written in Go,</text>
      <text x="28" y="167" class="sans" font-size="13.2" fill="#CBD5E1">orchestrating multi-mode generative stages.</text>
      <text x="28" y="188" class="sans" font-size="13.2" fill="#CBD5E1">Enforces Saga state-machine rollbacks and</text>
      <text x="28" y="209" class="sans" font-size="13.2" fill="#CBD5E1">outputs strict spec-compliant W3C EPUB 3.3.</text>
    </g>

