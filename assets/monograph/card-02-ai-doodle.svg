      <text x="518" y="123" text-anchor="middle" class="mono" font-size="9.5" fill="#FEF3C7">SAGA</text>
      <path d="M 518 132 V 154 H 449 V 132" fill="none" stroke="#D4AF37" stroke-dasharray="3 3" stroke-width="1.1"/>
      <line x1="483" y1="154" x2="483" y2="174" stroke="#60A5FA" stroke-width="1.3"/>
      <rect x="422" y="176" width="122" height="44" rx="7" fill="#0D224B" stroke="url(#goldFoil)" stroke-width="1.2"/>
      <text x="483" y="196" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#FEF3C7">W3C EPUB 3.3</text>
      <text x="483" y="211" text-anchor="middle" class="mono" font-size="8.8" fill="#93C5FD">Validated Archive</text>
    
    </g>

    <!-- Bottom Tech Chips -->
    <line x1="28" y1="244" x2="562" y2="244" stroke="#1E3A8A" stroke-opacity="0.45" stroke-width="1"/>
    <g>
