      <text x="80" y="273" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#FDE68A">Go (Golang)</text>
      <rect x="139" y="256" width="111" height="26" rx="6" fill="#081736" stroke="#1E3A8A" stroke-width="1"/>
      <text x="195" y="273" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#FDE68A">Saga Pattern</text>
      <rect x="258" y="256" width="111" height="26" rx="6" fill="#081736" stroke="#1E3A8A" stroke-width="1"/>
      <text x="314" y="273" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#FDE68A">W3C EPUB 3.3</text>
      <rect x="377" y="256" width="44" height="26" rx="6" fill="#081736" stroke="#1E3A8A" stroke-width="1"/>
