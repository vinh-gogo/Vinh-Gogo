    <circle cx="25" cy="26" r="15.5" fill="#07142E" stroke="#FBBF24" stroke-opacity="0.55" stroke-width="1.2"/>
    <rect x="17" y="20" width="16" height="12" rx="2.5" fill="none" stroke="#FEF08A" stroke-width="1.7"/><path d="M 18 21 L 25 26.5 L 32 21" fill="none" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round"/>
    <text class="mono" x="49" y="21" font-size="9.5" font-weight="700" letter-spacing="1.5" fill="#FBBF24">CONTACT ↗</text>
    <text class="sans" x="49" y="37" font-size="13.5" font-weight="800" letter-spacing="0.5" fill="#F8FAFC">DIRECT EMAIL</text>
