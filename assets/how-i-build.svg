<svg xmlns="http://www.w3.org/2000/svg" width="800" height="190" viewBox="0 0 800 190" role="img" aria-label="How I build: Research, Prototype, Evaluate, Ship" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect width="800" height="190" rx="16" fill="#0f0c29"/>
  <text x="400" y="36" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="5" fill="#7C3AED">HOW I BUILD</text>

  <!-- flowing connector -->
  <line x1="130" y1="95" x2="670" y2="95" stroke="url(#accent)" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="36" to="0" dur="1.5s" repeatCount="indefinite"/>
  </line>

  <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <g>
      <circle cx="100" cy="95" r="32" fill="#1e1650" stroke="#06B6D4" stroke-width="2"/>
      <text x="100" y="102" font-size="20" font-weight="700" fill="#ffffff">01</text>
      <text x="100" y="152" font-size="15" font-weight="600" fill="#c9d1d9">Research</text>
    </g>
    <g>
      <circle cx="300" cy="95" r="32" fill="#1e1650" stroke="#3f2b96" stroke-width="2"/>
      <text x="300" y="102" font-size="20" font-weight="700" fill="#ffffff">02</text>
      <text x="300" y="152" font-size="15" font-weight="600" fill="#c9d1d9">Prototype</text>
    </g>
    <g>
      <circle cx="500" cy="95" r="32" fill="#1e1650" stroke="#3f2b96" stroke-width="2"/>
      <text x="500" y="102" font-size="20" font-weight="700" fill="#ffffff">03</text>
      <text x="500" y="152" font-size="15" font-weight="600" fill="#c9d1d9">Evaluate</text>
    </g>
    <g>
      <circle cx="700" cy="95" r="32" fill="#1e1650" stroke="#7C3AED" stroke-width="2">
        <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <text x="700" y="102" font-size="20" font-weight="700" fill="#ffffff">04</text>
      <text x="700" y="152" font-size="15" font-weight="600" fill="#c9d1d9">Ship</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
